name: 🛡️ Quality Gate & Spec Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (si existe package.json)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Instalar dependencias
        if: hashFiles('package.json') != ''
        run: npm ci || npm install

      - name: Ejecutar Linting
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present

      - name: Ejecutar Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck --if-present

      - name: Ejecutar Pruebas
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Validar Estado de Especificaciones (Spec-Kit)
        run: |
          if [ -f "./.specify/scripts/verify-spec.sh" ]; then
            chmod +x ./.specify/scripts/verify-spec.sh
            ./.specify/scripts/verify-spec.sh
          fi

      - name: Validar Registro de Agentes y Gobernanza
        run: node bin/cli.js registry validate

      - name: Validar Protocolo de Handoffs de Agentes
        run: node bin/cli.js handoff validate

      - name: Auditar Sistema de Evidencias Reproducibles
        run: node bin/cli.js evidence verify

      - name: Validar Sistema de Memoria Persistente de Agentes
        run: node bin/cli.js memory validate

      - name: Ejecutar Evaluación Sintética de Enrutamiento y Seguridad (.evals)
        run: node bin/cli.js eval
