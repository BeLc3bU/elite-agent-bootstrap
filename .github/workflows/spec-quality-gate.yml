name: 🛡️ Quality Gate & ODD Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (si existe package.json)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Instalar dependencias
        if: hashFiles('package.json') != ''
        run: npm ci || npm install

      - name: Ejecutar Linting
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present

      - name: Ejecutar Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck --if-present

      - name: Ejecutar Pruebas Unitarias e Integración
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Validar Guardrails Gentle Shell (Conflictos y Políticas)
        run: node bin/cli.js guard --conflicts

      - name: Validar Estado de Documentos ODD y Specs
        run: node bin/cli.js verify

      - name: Validar Registro de Agentes y Gobernanza
        run: node bin/cli.js registry validate

      - name: Validar Protocolo de Handoffs de Agentes
        run: node bin/cli.js handoff validate

      - name: Auditar Sistema de Evidencias Reproducibles
        run: node bin/cli.js evidence verify

      - name: Validar Sistema de Memoria Persistente de Agentes
        run: node bin/cli.js memory validate

      - name: Ejecutar Evaluación Sintética de Enrutamiento y Seguridad (.evals)
        run: node bin/cli.js eval
